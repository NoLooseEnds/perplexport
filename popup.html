<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perplexport</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon48.png" width="28" height="28" alt="" />
        <div>
          <h1>Perplexport</h1>
          <p id="status">Checking active tab…</p>
        </div>
      </header>

      <section class="actions">
        <button type="button" data-action="md" disabled>
          Download Markdown
        </button>
        <button type="button" data-action="json" disabled>
          Download JSON
        </button>
        <button type="button" data-action="copy" disabled>
          Copy Markdown
        </button>
      </section>

      <p class="hint">
        On a thread: export Markdown/JSON. On a project (<code>/projects/…</code>) or <code>/library</code>: use the <strong>Bulk</strong> button to save many threads (opened one by one in the background).
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
